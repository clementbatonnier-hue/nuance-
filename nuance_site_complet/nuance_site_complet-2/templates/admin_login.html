{% extends 'base.html' %}
{% block title %}Administration — {{ site_name }}{% endblock %}
{% block content %}
<div class="panel narrow auth-panel">
  <span class="eyebrow">ESPACE ORGANISATEUR</span>
  <h1>Administration</h1>
  <p class="muted">Connecte-toi pour gérer les événements, les invitations et la publication des matchs.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Mot de passe admin<input type="password" name="password" required></label>
    <button class="btn primary full">Entrer</button>
  </form>
</div>
{% endblock %}
