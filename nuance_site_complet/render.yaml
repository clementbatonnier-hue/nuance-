services:
  - type: web
    name: nuance-match
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nuance-db
          property: connectionString

databases:
  - name: nuance-db
    databaseName: nuance
    user: nuance
