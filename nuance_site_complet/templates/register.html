{% extends 'base.html' %}{% block title %}Créer mon compte — Nüance{% endblock %}{% block content %}<div class="panel narrow"><h1>Créer mon compte</h1><p class="muted">Ton invitation te donne accès au questionnaire.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Code d’invitation<input name="code" required placeholder="EX. A7D4K9P2QX"></label><label>Prénom ou pseudo<input name="display_name" required></label><label>E-mail<input name="email" type="email" required></label><label>Mot de passe<input name="password" type="password" minlength="8" required></label><label class="check"><input type="checkbox" name="adult" required><span>Je confirme avoir 18 ans ou plus.</span></label><label class="check"><input type="checkbox" name="consent" required><span>J’accepte que mes réponses soient utilisées pour calculer une compatibilité avec d’autres participants.</span></label><button class="btn primary full">Continuer</button></form></div>{% endblock %}
