<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Nüance{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('home') }}">Nüance</a><nav>{% if current_user %}<a href="{{ url_for('profile') }}">Profil</a><a href="{{ url_for('my_match') }}">Match</a><a href="{{ url_for('logout') }}">Déconnexion</a>{% else %}<a href="{{ url_for('login') }}">Connexion</a>{% endif %}</nav></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{category}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer><a href="{{ url_for('privacy') }}">Confidentialité</a><span>•</span><span>18+</span></footer></body></html>
